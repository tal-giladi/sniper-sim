<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sniper Sim</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="view"></canvas>
  <canvas id="overlay"></canvas>

  <div id="hud" class="hidden">
    <div id="kestrel" class="panel tl"></div>
    <div id="turrets" class="panel tr"></div>
    <div id="status" class="panel bl"></div>
    <div id="breath"><div id="breathFill"></div></div>
    <div id="report" class="panel br hidden"></div>
    <div id="dope" class="panel hidden"></div>
  </div>

  <div id="menu" class="screen">
    <div class="menuBox">
      <h1>SNIPER SIM</h1>
      <div class="cols">
        <div>
          <div id="missionList"></div>
        </div>
        <div class="side">
          <label>Rifle <select id="rifle"></select></label>
          <label>Mouse sensitivity <input id="sens" type="range" min="0.2" max="2" step="0.05" value="1"></label>
          <div id="customPanel" class="hidden"></div>
          <button id="start" class="primary">Start</button>
          <div class="keys">
            <div><kbd>Mouse</kbd> aim</div>
            <div><kbd>Left click</kbd> fire</div>
            <div><kbd>Right click</kbd>/<kbd>Z</kbd> scope</div>
            <div><kbd>Wheel</kbd> magnification</div>
            <div><kbd>↑ ↓</kbd> elevation 0.1 mil (<kbd>Ctrl</kbd> 1 mil)</div>
            <div><kbd>← →</kbd> windage 0.1 mil</div>
            <div><kbd>X</kbd> turrets to zero</div>
            <div><kbd>Shift</kbd>/<kbd>Space</kbd> hold breath</div>
            <div><kbd>Q E</kbd> level the rifle (cant)</div>
            <div><kbd>F</kbd> laser rangefinder</div>
            <div><kbd>Tab</kbd> data card</div>
            <div><kbd>Esc</kbd> pause</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="pause" class="screen hidden">
    <div class="menuBox small">
      <h2>Paused</h2>
      <div class="btns">
        <button id="resume" class="primary">Resume</button>
        <button id="restart">Restart</button>
        <button id="quit">Missions</button>
      </div>
    </div>
  </div>

  <div id="summary" class="screen hidden">
    <div class="menuBox" id="summaryBody"></div>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
